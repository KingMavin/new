name: immortal_path
description: A single-player idle cultivation RPG inspired by xianxia mythology.
publish_to: "none"
version: 0.20.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0C0E14"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
